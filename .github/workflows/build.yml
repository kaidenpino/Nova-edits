name: Build Nova APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "licenses step done"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Find the project
        id: locate
        shell: bash
        run: |
          if [ -f nova.zip ]; then
            mkdir -p project
            unzip -q -o nova.zip -d project
            echo "Unzipped nova.zip into ./project"
          fi
          SETTINGS=$(find . -maxdepth 3 -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: no settings.gradle.kts found. Files in the repo:"
            find . -maxdepth 3 -not -path "./.git/*" | head -60
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Apply overrides
        shell: bash
        run: |
          if [ -d overrides ]; then
            cp -rv overrides/. "${{ steps.locate.outputs.dir }}/"
          else
            echo "no overrides folder"
          fi

      - name: Apply export fixes
        shell: bash
        run: |
          F="${{ steps.locate.outputs.dir }}/app/src/main/java/com/nova/export/NovaExporter.kt"
          if [ -f "$F" ]; then
            sed -i 's/import androidx.media3.common.Effects/import androidx.media3.transformer.Effects/' "$F"
            sed -i 's/Composition.Builder(\*sequences.toTypedArray())/Composition.Builder(sequences)/' "$F"
            grep -n "Effects\|Composition.Builder" "$F" || true
          fi

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: gradle assembleDebug --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Publish APK as a release (direct download, no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nova debug build ${{ github.run_number }}
          files: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Show errors in the run summary
        if: always() && steps.locate.outputs.dir != ''
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          {
            echo "### Build errors (first lines)"
            echo '```'
            if [ -f "$LOG" ] && grep -qE "^e: |error:|What went wrong|FAILED" "$LOG"; then
              grep -E "^e: |error:|What went wrong|Execution failed|FAILED" -A2 "$LOG" | head -n 70
            elif [ -f "$LOG" ]; then
              echo "(no compiler errors found; last lines of the log)"
              tail -n 30 "$LOG"
            else
              echo "(no build log: the build step did not run)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run unit tests (informational)
        if: always() && steps.locate.outputs.dir != ''
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        continue-on-error: true
        run: gradle testDebugUnitTest --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/test.log"

      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
