name: Build Nova APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the job attach the APK to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Unpack project from nova.zip
        run: |
          mkdir -p project
          unzip -q nova.zip -d project

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: gradle assembleDebug --stacktrace --console=plain 2>&1 | tee ../build.log

      - name: Publish APK as a release (direct download, no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nova debug build ${{ github.run_number }}
          files: project/app/build/outputs/apk/debug/app-debug.apk

      # Tests run AFTER the APK is published, so a failing test never blocks your build.
      - name: Run unit tests (informational)
        if: always()
        working-directory: project
        shell: bash
        continue-on-error: true
        run: gradle testDebugUnitTest --console=plain 2>&1 | tee ../test.log

      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
